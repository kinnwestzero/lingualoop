<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#090b10"><title>LinguaLoop</title><link rel="stylesheet" href="styles.css?v=20260920-28"></head><body><main class="app">
<header><h1 class="brand">Lingua<span>Loop</span></h1><div class="headerTools"><div class="streak">🔥 <b id="streak">1</b></div><button id="syncBtn" class="ghost syncBtn">☁️ <span id="syncStatus">동기화</span></button></div></header>
<section id="syncPanel" class="panel syncPanel hidden"><span class="eyebrow">PRIVATE SYNC</span><h2>기기 동기화</h2><label>Project URL<input id="syncUrl"></label><label>Publishable key<input id="syncKey" type="password"></label><label>개인 Sync ID<input id="syncToken" type="password"></label><div class="actions"><button id="syncCancel" class="ghost">취소</button><button id="syncSave" class="primary">저장</button></div></section>
<nav class="bottomNav"><button data-go="todayPanel" class="navActive">⌂<span>홈</span></button><button data-go="lesson">◉<span>학습</span></button><button data-go="aiPanel">✦<span>AI</span></button><button data-go="phraseHome">▤<span>내 문장</span></button></nav>
<section class="panel todayPanel"><div class="sectionHead"><div><span class="eyebrow">TODAY</span><h2>오늘의 루프</h2></div><span class="badge">약 25분</span></div><div id="todayPlan" class="dailyStack"></div><div id="dailyFocus" class="dailyFocus"></div><div id="dailyRunner" class="dailyRunner hidden"></div></section>
<section class="languageStrip"><div class="sectionHead"><span class="eyebrow">LANGUAGES</span><button id="reviewBtn" class="tinyReview">연습 <b id="reviewCount">0</b></button></div><div id="languages" class="languages"></div></section>
<section class="panel lesson"><div class="lessonTop"><div><span id="modeBadge" class="badge"></span><h2 id="lessonTitle"></h2></div><span id="progressText"></span></div><div class="progress"><i id="progressBar"></i></div><div class="scene"><span class="sceneLabel">TODAY</span><h3 id="sceneTitle"></h3><p id="sceneGoal"></p></div><div id="starterGuide" class="starterGuide hidden"></div><div class="dialogue"><div class="bubble tutor"><small>LinguaLoop</small><p id="prompt"></p><div class="promptTools"><button id="speakBtn" class="ghost">🔊 듣기</button><button id="promptMeaningBtn" class="ghost">뜻 보기</button></div><p id="promptMeaning" class="promptMeaning hidden"></p></div><div class="bubble user"><small>나의 차례</small><p id="hint"></p><button id="micBtn" class="primary">🎙 말하기</button><p id="transcript" class="transcript"></p></div></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="prevBtn" class="ghost">← 이전</button><button id="nextBtn" class="primary">다음 →</button></div></section>
<section class="panel academicPanel"><div class="sectionHead"><div><span class="eyebrow">ACADEMIC ENGLISH</span><h2>English Lab</h2></div><span class="badge">10분</span></div><div id="academicModes" class="academicModes"><button data-ac="reading">Reading</button><button data-ac="writing">Writing</button><button data-ac="seminar">Seminar</button><button data-ac="presentation">Presentation</button></div><div id="academicTask" class="academicTask"></div><button id="academicStart" class="primary wide">오늘 English 시작 →</button></section>
<section class="panel aiPanel"><div class="aiGlow"></div><div class="aiHead"><div><span class="eyebrow aiEyebrow">AI</span><h2>연습 도구</h2></div><span id="aiStatus" class="badge">설정 필요</span></div>
<div class="aiModeSwitch aiModeSwitch3"><button class="aiModeTab active" data-ai-mode="content"><b>🎧 섀도잉</b><small>콘텐츠 한 문장</small></button><button class="aiModeTab" data-ai-mode="coach"><b>✦ 코칭</b><small>단어 · 문법 · 현지 표현</small></button><button class="aiModeTab" data-ai-mode="roleplay"><b>💬 역할극</b><small>배운 표현 써보기</small></button></div>
<div id="roleplaySetup" class="roleplaySetup hidden"><label>언어<select id="roleplayLang"></select></label></div>
<div id="conversationArea"><div id="aiThread" class="aiThread"><div class="aiMsg coach">문장이나 표현을 물어보세요.</div></div><div class="composer"><textarea id="aiInput" rows="2" placeholder="문장, 문법, 번역, 자연스러운 표현"></textarea><button id="aiListenBtn" class="listenOrb">🎙</button><button id="aiSendBtn" class="sendOrb">↑</button></div><div id="coachTools"><div class="aiChips"><button data-prompt="이 단어나 표현 뜻과 쓰임을 초보자에게 설명해줘">단어·표현</button><button data-prompt="이 문장의 핵심 문법만 쉽게 설명해줘">문법</button><button data-prompt="현지인이 실제 대화에서 더 자주 쓰는 표현으로 바꿔줘">현지 표현</button><button data-prompt="이 문장을 자연스럽게 고쳐줘">자연스럽게</button></div></div><div class="actions aiActions"><button id="aiCorrectBtn" class="ghost">✦ 첨삭</button><button id="aiChatBtn" class="primary">AI 코칭 →</button></div><button id="topicPracticeBtn" class="hidden">역할극 시작</button><button id="heardPracticeBtn" class="hidden">콘텐츠 문장</button></div>
<div id="contentWorkspace" class="contentWorkspace hidden"><div class="contentIntro"><span>🎧</span><div><b>한 문장 가져오기</b><small id="contentStatus">Mac에서 한 문장을 재생하고 아래 버튼을 누르세요.</small></div></div><button id="contentStartBtn" class="primary wide">🎙 문장 듣기</button><div id="captureReview" class="captureReview hidden"><div class="captureHead"><small id="captureShadowStatus">1 · 원문 확인</small><button id="captureRetry" class="ghost mini">↻ 다시 듣기</button></div><textarea id="capturedText" rows="2"></textarea><div class="shadowCard"><b id="captureShadowText"></b><p id="captureShadowMeaning" class="hidden"></p><div class="shadowActions"><button id="captureListen" class="ghost">🔊 듣기</button><button id="captureShadow" class="primary">🎙 따라하기</button><button id="captureRecall" class="ghost">뜻만 보고</button><button id="captureReveal" class="ghost">원문 보기</button></div></div><div class="actions captureSaveActions"><button id="captureCorrect" class="ghost">✦ 교정</button><button id="captureSave" class="ghost">저장</button><button id="capturePractice" class="primary">저장 + 연습</button></div></div></div></section>
<section class="panel phraseHome"><div class="sectionHead"><div><span class="eyebrow">MY PHRASES</span><h2>배운 문장</h2></div><span id="dueBadge" class="badge">0개 복습</span></div><div id="phraseStats" class="phraseStats"></div><div class="phraseTabs"><button class="active" data-phrase-tab="due">오늘</button><button data-phrase-tab="weak">어려운 문장</button><button data-phrase-tab="saved">전체</button></div><div id="reviewSession" class="reviewSession"></div><div id="phraseBrowser" class="phraseBrowser hidden"><div class="phraseTools"><select id="phraseLang"></select><input id="phraseSearch" type="search" placeholder="문장 검색"></div><div id="phraseList" class="phraseList"></div></div></section><section class="panel weakness"><div class="sectionHead"><div><span class="eyebrow">WEAKNESS</span><h2>내 약점</h2></div><b id="weakCount">0</b></div><div id="weaknessList" class="weaknessList"></div></section>
<div class="hidden"><b id="doneCount">0</b><b id="xp">0</b></div></main><script src="app.js?v=20260920-28"></script></body></html>
