<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#111827"><title>LinguaLoop v2</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><header><div><span class="eyebrow">LINGUALOOP V2</span><h1>말하면서 배우는 언어 루프</h1><p>짧게 듣고, 직접 말하고, 바로 복습하세요.</p></div><div class="streak">🔥 <b id="streak">1</b> day</div></header>
<section class="panel"><h2>오늘 어떤 언어로 연습할까요?</h2><div id="languages" class="languages"></div></section>
<section class="panel lesson"><div class="lessonTop"><div><span id="modeBadge" class="badge"></span><h2 id="lessonTitle"></h2></div><span id="progressText"></span></div><div class="progress"><i id="progressBar"></i></div>
<div class="scene"><span class="sceneLabel">TODAY'S SCENE</span><h3 id="sceneTitle"></h3><p id="sceneGoal"></p></div>
<div class="dialogue"><div class="bubble tutor"><small>LinguaLoop</small><p id="prompt"></p><button id="speakBtn" class="ghost">🔊 듣기</button></div>
<div class="bubble user"><small>나의 차례</small><p id="hint"></p><button id="micBtn" class="primary">🎙 말하기</button><p id="transcript" class="transcript"></p></div></div>
<div id="feedback" class="feedback hidden"></div><div class="actions"><button id="prevBtn" class="ghost">← 이전</button><button id="nextBtn" class="primary">다음 표현 →</button></div></section>
<section class="panel stats"><div><b id="doneCount">0</b><span>완료 표현</span></div><div><b id="xp">0</b><span>XP</span></div><div><b>5–10분</b><span>Daily Loop</span></div></section></main><script src="app.js"></script></body></html>
